<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Register – JHONNYWIN</title>
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        body { background:#0a0e17; color:#f1f1f1; font-family:'Segoe UI',Arial,sans-serif; display:flex; justify-content:center; align-items:center; min-height:100vh; }
        .register-box { background:#141f2f; padding:40px; border-radius:16px; max-width:400px; width:100%; border:1px solid #ffd70033; }
        .register-box h2 { color:#ffd700; margin-bottom:20px; text-align:center; }
        .register-box input { width:100%; padding:12px; margin:10px 0; border:none; border-radius:8px; background:#1e2f42; color:#fff; font-size:1rem; }
        .register-box button { width:100%; padding:12px; border:none; border-radius:8px; background:#ffd700; color:#0a0e17; font-weight:bold; font-size:1.1rem; cursor:pointer; transition:0.2s; }
        .register-box button:hover { background:#f5a623; }
        .register-box .error { color:#ff6b6b; margin-top:10px; text-align:center; }
        .register-box .info { color:#8899bb; margin-top:15px; text-align:center; }
        .register-box .info a { color:#ffd700; text-decoration:none; }
        .register-box .info a:hover { text-decoration:underline; }
    </style>
</head>
<body>
    <div class="register-box">
        <h2>📝 Register</h2>
        <form id="registerForm">
            <input type="text" id="username" placeholder="Username" required />
            <input type="password" id="password" placeholder="Password" required />
            <button type="submit">Register</button>
            <div id="errorMsg" class="error"></div>
            <div class="info">Already have an account? <a href="login.html">Login</a></div>
        </form>
    </div>
    <script>
        document.getElementById('registerForm').addEventListener('submit', (e) => {
            e.preventDefault();
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value.trim();
            if (!username || !password) {
                document.getElementById('errorMsg').textContent = '⚠️ Please fill all fields.';
                return;
            }
            const users = JSON.parse(localStorage.getItem('users')) || {};
            if (users[username]) {
                document.getElementById('errorMsg').textContent = '❌ Username already taken.';
                return;
            }
            users[username] = password;
            localStorage.setItem('users', JSON.stringify(users));
            localStorage.setItem('currentUser', JSON.stringify({ username }));
            window.location.href = 'index.html';
        });
    </script>
</body>
</html>
