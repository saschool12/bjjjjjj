<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#111216">
  <title>JHONNYWIN</title>
  <link rel="stylesheet" href="styles.css">
</head>

<body>
<div class="app">

<header class="topbar">
  <div class="brand">
    JHONNYWIN
    <small>PLAY • HAVE FUN • DEMO</small>
  </div>

  <div class="profile">
    <div class="avatar">👤</div>
    <div class="profile-text">
      <b>◉ <span id="balance">1,000</span></b>
      <div class="vip">VIP BASIC</div>
    </div>
    <button id="power" class="power">⏻</button>
  </div>
</header>

<section class="promo-strip">
  <button id="promoClose" class="close-promo">×</button>
  <div class="promo-pill">Every Night</div>
  <div class="promo-pill">Weekly Sunday</div>
  <div class="promo-pill">Monthly 14th</div>
  <button class="promo-main" onclick="toast('Promotions are demo-only')">
    📦 Download & Claim
  </button>
</section>

<main class="main">

  <aside id="categories" class="sidebar"></aside>

  <section class="content">

    <div class="hero">
      <div>
        <h1>Games</h1>
        <p>Browse the demo lobby. No real-money wagering or deposits.</p>
      </div>
      <div class="hero-badge">🏆</div>
    </div>

    <div class="toolbar">
      <input
        id="search"
        class="search"
        placeholder="Search games…"
        autocomplete="off"
      >

      <select id="sort" class="sort">
        <option value="popular">Popular</option>
        <option value="az">A-Z</option>
      </select>
    </div>

    <div id="gameGrid" class="game-grid"></div>

  </section>
</main>
</div>

<nav class="bottom-nav">
  <button class="nav-item active" data-label="Home">
    <span class="ico">🏠</span>
    Home
  </button>

  <button class="nav-item" data-label="Agent">
    <span class="ico">🧧</span>
    Agent
  </button>

  <button class="nav-item deposit" data-label="Deposit">
    <span class="ico">💰</span>
    Deposit
  </button>

  <button class="nav-item" data-label="Promotion">
    <span class="ico">🎁</span>
    Promotion
  </button>

  <button class="nav-item" data-label="Member">
    <span class="ico">👤</span>
    Member
  </button>
</nav>

<div id="gameModal" class="modal">
  <div class="modal-box">

    <div class="modal-head">
      <h2 id="modalTitle">Game</h2>
      <button id="closeModal" class="x">×</button>
    </div>

    <div id="modalArt" class="modal-art">🎰</div>

    <div class="modal-balance">
      Demo points:
      <span id="modalBalance">1,000</span>
    </div>

    <div class="modal-row">
      <input id="demoBet" type="number" min="1" value="10">
      <button id="playDemo" class="gold-btn">
        Play Demo
      </button>
    </div>

    <div class="notice">
      This is a demo only. No real money, deposits,
      withdrawals or real betting are processed.
    </div>

  </div>
</div>

<div id="toast" class="toast"></div>

<script src="scripts.js"></script>
</body>
</html>
