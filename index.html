<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Luckline – Play & Win</title>
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        body { background:#0b0b0f; color:#f1f1f1; font-family:'Segoe UI',Arial,sans-serif; }
        header { background:linear-gradient(90deg,#111,#222); padding:15px 30px; display:flex; align-items:center; justify-content:space-between; position:sticky; top:0; z-index:10; flex-wrap:wrap; gap:10px; }
        header .logo { font-size:1.6rem; font-weight:bold; color:#00e676; display:flex; align-items:center; gap:8px; }
        header .logo img { height:28px; width:28px; }
        nav { display:flex; align-items:center; gap:12px; flex-wrap:wrap; }
        nav a { color:#ddd; text-decoration:none; font-weight:500; transition:color 0.2s; }
        nav a:hover, nav a.active { color:#00e676; }
        .btn { background:#00e676; color:#000; padding:6px 14px; border-radius:6px; font-weight:bold; text-decoration:none; }
        .btn:hover { background:#1de9b6; }
        .user-greeting { color:#00e676; font-weight:500; }
        .banner { background:url('https://images.pexels.com/photos/1871508/pexels-photo-1871508.jpeg') center/cover no-repeat; height:300px; display:flex; flex-direction:column; justify-content:center; align-items:center; color:#fff; text-shadow:0 2px 6px rgba(0,0,0,0.8); text-align:center; }
        .banner h1 { font-size:2.8rem; margin-bottom:8px; }
        .banner p { font-size:1.2rem; margin-bottom:15px; }
        .banner .btn { padding:12px 24px; border-radius:8px; }
        .section { padding:40px 20px; max-width:1200px; margin:auto; }
        .section h2 { text-align:center; color:#00e676; margin-bottom:30px; font-size:2rem; }
        .categories { display:flex; flex-wrap:wrap; justify-content:center; gap:0.8rem; margin-bottom:2rem; }
        .cat-btn { padding:0.7rem 1.8rem; border:none; border-radius:30px; font-weight:600; cursor:pointer; background:#1a1a24; color:#8899bb; transition:all 0.3s ease; font-size:1rem; }
        .cat-btn:hover { background:#2a2a3a; color:#fff; }
        .cat-btn.active { background:#00e676; color:#000; box-shadow:0 4px 20px rgba(0,230,118,0.3); }
        #game-grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(180px,1fr)); gap:1.5rem; }
        .game-card { background:#16161d; border-radius:16px; padding:1.5rem 1rem; text-align:center; cursor:pointer; transition:transform 0.3s, box-shadow 0.3s; border:1px solid #2a2a3a; box-shadow:0 4px 15px rgba(0,0,0,0.4); text-decoration:none; color:inherit; display:block; }
        .game-card:hover { transform:translateY(-6px); border-color:#00e676; box-shadow:0 8px 30px rgba(0,230,118,0.15); }
        .game-card .icon { font-size:3rem; margin-bottom:0.5rem; }
        .game-card .name { font-size:1.1rem; font-weight:700; }
        .game-card .sub { font-size:0.75rem; color:#5a7a9a; margin-top:4px; }
        .play-btn { display:inline-block; margin-top:0.8rem; padding:0.4rem 1.2rem; border:none; border-radius:20px; background:#00e676; color:#000; font-weight:700; cursor:pointer; transition:transform 0.2s; }
        .play-btn:hover { transform:scale(1.05); }
        footer { background:#111; color:#bbb; text-align:center; padding:20px; margin-top:40px; font-size:0.9rem; }
        footer a { color:#00e676; text-decoration:none; margin:0 8px; }
        footer a:hover { text-decoration:underline; }
        @media (max-width:600px) {
            header { flex-direction:column; align-items:stretch; }
            nav { justify-content:center; }
        }
    </style>
</head>
<body>
    <header>
        <div class="logo"><img src="https://cdn-icons-png.flaticon.com/512/3082/3082031.png" alt="logo" /> Luckline</div>
        <nav id="navLinks">
            <a href="index.html" class="active">Home</a>
            <a href="#games">Games</a>
            <a href="#promo">Promotions</a>
            <a href="#support">Support</a>
        </nav>
    </header>

    <section class="banner">
        <h1>🎰 Play & Win Big</h1>
        <p>Slots • Fish • Casino • Sports • Lottery</p>
        <a href="#games" class="btn">Start Playing</a>
    </section>

    <section id="games" class="section">
        <h2>🎮 Game Categories</h2>
        <nav class="categories">
            <button class="cat-btn active" data-category="slots">🎰 Slots</button>
            <button class="cat-btn" data-category="fish">🐟 Fish</button>
            <button class="cat-btn" data-category="casino">♠️ Casino</button>
            <button class="cat-btn" data-category="sports">⚽ Sports</button>
            <button class="cat-btn" data-category="lottery">🎲 Lottery</button>
        </nav>
        <div id="game-grid"></div>
    </section>

    <footer>
        <p>© 2025 Luckline |
            <a href="#">Terms</a> |
            <a href="#">Support</a> |
            <a href="#">Privacy</a>
        </p>
    </footer>

    <script>
        // Auth
        const currentUser = JSON.parse(localStorage.getItem('currentUser')) || null;
        function updateNav() {
            const nav = document.getElementById('navLinks');
            if (currentUser) {
                nav.innerHTML = `
                    <a href="index.html" class="active">Home</a>
                    <a href="#games">Games</a>
                    <a href="#promo">Promotions</a>
                    <a href="#support">Support</a>
                    <span class="user-greeting">👤 ${currentUser.username}</span>
                    <a href="#" onclick="logout(); return false;" class="btn" style="background:#ff4444;color:#fff;">Logout</a>
                `;
            } else {
                nav.innerHTML = `
                    <a href="index.html" class="active">Home</a>
                    <a href="#games">Games</a>
                    <a href="#promo">Promotions</a>
                    <a href="#support">Support</a>
                    <a href="login.html" class="btn">Login</a>
                    <a href="register.html" class="btn">Register</a>
                `;
            }
        }
        window.logout = function() { localStorage.removeItem('currentUser'); location.reload(); };
        updateNav();

        // GAME DATA
        const GAME_DATA = {
            slots: [
                { id:'super-ace', name:'Super Ace', sub:'JILI', icon:'🃏', type:'slot' },
                { id:'wild-bounty', name:'Wild Bounty', sub:'Hacksaw', icon:'🌾', type:'slot' },
                { id:'dragon-gem', name:'Dragon Gem', sub:'PG', icon:'🐉', type:'slot' },
                { id:'golden-empire', name:'Golden Empire', sub:'JILI', icon:'🏛️', type:'slot' }
            ],
            fish: [
                { id:'poker-kingdom', name:'Poker Kingdom', sub:'Fishing', icon:'🐠', type:'fish' },
                { id:'golden-empire-fish', name:'Golden Empire', sub:'Fishing', icon:'🐟', type:'fish' },
                { id:'fortune-ge', name:'Fortune GE', sub:'Fishing', icon:'🎣', type:'fish' }
            ],
            casino: [
                { id:'poker', name:'Poker', sub:'Classic', icon:'♠️', type:'poker' },
                { id:'money-coming', name:'Money Coming', sub:'JILI', icon:'💰', type:'slot' },
                { id:'pinata-wins', name:'Pinata Wins', sub:'PG', icon:'🎉', type:'slot' },
                { id:'treasures', name:'Treasures of...', sub:'JILI', icon:'💎', type:'slot' }
            ],
            sports: [
                { id:'money-coming-sport', name:'Money Coming', sub:'Sports', icon:'⚽', type:'sport' },
                { id:'pinata-wins-sport', name:'Pinata Wins', sub:'Sports', icon:'🏆', type:'sport' },
                { id:'pp', name:'PP', sub:'Sports', icon:'🏏', type:'sport' },
                { id:'fc', name:'FC', sub:'Sports', icon:'⚽', type:'sport' },
                { id:'pg', name:'PG', sub:'Sports', icon:'🏀', type:'sport' }
            ],
            lottery: [
                { id:'sweet-bonanza', name:'Sweet Bonanza', sub:'PG', icon:'🍭', type:'slot' },
                { id:'chinese-new', name:'Chinese New Year', sub:'JILI', icon:'🧧', type:'slot' },
                { id:'wild-ape', name:'Wild Ape #32', sub:'Hacksaw', icon:'🦍', type:'slot' }
            ]
        };

        let currentCategory = 'slots';
        function renderGames(category) {
            const grid = document.getElementById('game-grid');
            const games = GAME_DATA[category] || [];
            grid.innerHTML = games.map(g => `
                <a href="game.html?id=${encodeURIComponent(g.id)}&type=${encodeURIComponent(g.type)}" class="game-card">
                    <div class="icon">${g.icon}</div>
                    <div class="name">${g.name}</div>
                    <div class="sub">${g.sub}</div>
                    <span class="play-btn">▶ Play</span>
                </a>
            `).join('');
        }
        document.querySelectorAll('.cat-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                currentCategory = btn.dataset.category;
                renderGames(currentCategory);
            });
        });
        renderGames('slots');
    </script>
</body>
</html>
