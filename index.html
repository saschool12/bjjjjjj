<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>JHONNYWIN – Play & Win</title>
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        body {
            background: #0a0e17;
            color: #f1f1f1;
            font-family: 'Segoe UI', Arial, sans-serif;
            min-height: 100vh;
        }
        header {
            background: linear-gradient(90deg, #0f1a2b, #1a2a3f);
            padding: 15px 30px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 2px solid #ffd700;
            flex-wrap: wrap;
            gap: 10px;
        }
        header .logo {
            font-size: 1.8rem;
            font-weight: 900;
            background: linear-gradient(135deg, #ffd700, #f5a623);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        nav {
            display: flex;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
        }
        nav a {
            color: #ddd;
            text-decoration: none;
            font-weight: 500;
            transition: color 0.2s;
            padding: 6px 10px;
            border-radius: 6px;
        }
        nav a:hover, nav a.active { color: #ffd700; background: #1e2f42; }
        .btn {
            background: #ffd700;
            color: #0a0e17;
            padding: 6px 14px;
            border-radius: 6px;
            font-weight: bold;
            text-decoration: none;
            transition: 0.2s;
        }
        .btn:hover { background: #f5a623; }
        .user-greeting { color: #ffd700; font-weight: 500; }

        .banner {
            background: linear-gradient(135deg, #0f1a2b, #1a2a3f);
            padding: 60px 20px;
            text-align: center;
            border-bottom: 1px solid #ffd70033;
        }
        .banner h1 {
            font-size: 2.8rem;
            background: linear-gradient(135deg, #ffd700, #ff6b00);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 10px;
        }
        .banner p {
            color: #8899bb;
            font-size: 1.2rem;
            margin-bottom: 20px;
        }
        .banner .btn {
            padding: 12px 30px;
            font-size: 1.1rem;
            border-radius: 30px;
            -webkit-text-fill-color: #0a0e17;
        }

        .section { padding: 40px 20px; max-width: 1200px; margin: auto; }
        .section h2 {
            text-align: center;
            color: #ffd700;
            margin-bottom: 30px;
            font-size: 2rem;
        }

        /* Game grid */
        .game-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 1.5rem;
        }
        .game-card {
            background: #141f2f;
            border-radius: 16px;
            padding: 1.5rem 1rem;
            text-align: center;
            border: 1px solid #1e2f42;
            box-shadow: 0 4px 15px rgba(0,0,0,0.4);
            transition: 0.3s;
            text-decoration: none;
            color: inherit;
            display: block;
        }
        .game-card:hover {
            transform: translateY(-6px);
            border-color: #ffd700;
            box-shadow: 0 8px 30px rgba(255,215,0,0.15);
        }
        .game-card .icon { font-size: 3rem; margin-bottom: 0.5rem; }
        .game-card .name { font-size: 1.1rem; font-weight: 700; color: #e8edf5; }
        .game-card .sub { font-size: 0.75rem; color: #5a7a9a; margin-top: 4px; }
        .play-btn {
            display: inline-block;
            margin-top: 0.8rem;
            padding: 0.4rem 1.2rem;
            border: none;
            border-radius: 20px;
            background: #ffd700;
            color: #0a0e17;
            font-weight: 700;
            cursor: pointer;
            transition: 0.2s;
        }
        .play-btn:hover { transform: scale(1.05); }

        footer {
            background: #0f1a2b;
            color: #8899bb;
            text-align: center;
            padding: 20px;
            margin-top: 40px;
            border-top: 1px solid #1e2f42;
        }
        footer a { color: #ffd700; text-decoration: none; margin: 0 8px; }
        footer a:hover { text-decoration: underline; }

        @media (max-width: 600px) {
            header { flex-direction: column; align-items: stretch; }
            nav { justify-content: center; }
            .banner h1 { font-size: 2rem; }
        }
    </style>
</head>
<body>
    <header>
        <div class="logo">🎰 JHONNYWIN</div>
        <nav id="navLinks">
            <a href="index.html" class="active">Home</a>
            <a href="#games">Games</a>
            <a href="#promo">Promotions</a>
            <a href="#support">Support</a>
        </nav>
    </header>

    <section class="banner">
        <h1>WELCOME BONUS</h1>
        <p>PLAY · WIN · HAVE FUN<br />Arcade games with virtual points.</p>
        <a href="#games" class="btn">PLAY NOW</a>
    </section>

    <section id="games" class="section">
        <h2>🎮 Games</h2>
        <div class="game-grid" id="gameGrid">
            <!-- Injected by JS -->
        </div>
    </section>

    <footer>
        <p>© 2025 JHONNY Arcade · Educational Demo · Virtual points only</p>
    </footer>

    <script>
        // ---------- AUTH (optional) ----------
        const currentUser = JSON.parse(localStorage.getItem('currentUser')) || null;
        const nav = document.getElementById('navLinks');
        if (currentUser) {
            nav.innerHTML = `
                <a href="index.html" class="active">Home</a>
                <a href="#games">Games</a>
                <a href="#promo">Promotions</a>
                <a href="#support">Support</a>
                <span class="user-greeting">Hi, ${currentUser.username}</span>
                <a href="#" onclick="logout(); return false;" class="btn" style="background:#ff4444;color:#fff;">Logout</a>
            `;
        } else {
            nav.innerHTML += `
                <a href="login.html" class="btn">Login</a>
                <a href="register.html" class="btn">Register</a>
            `;
        }
        window.logout = function() { localStorage.removeItem('currentUser'); location.reload(); };

        // ---------- GAME DATA (matches your JHONNYWIN screenshot) ----------
        const GAMES = [
            { id: '777', name: '777', sub: 'Lucky Slots', icon: '🎰', type: 'slot' },
            { id: 'number-guess', name: 'Number Guess', sub: 'Guess the number', icon: '🔢', type: 'guess' },
            { id: 'reaction-test', name: 'Reaction Test', sub: 'Test your speed', icon: '⚡', type: 'reaction' },
            { id: 'memory-match', name: 'Memory Match', sub: 'Match the pairs', icon: '🧠', type: 'memory' }
        ];

        const grid = document.getElementById('gameGrid');
        grid.innerHTML = GAMES.map(g => `
            <a href="game.html?id=${g.id}&type=${g.type}" class="game-card">
                <div class="icon">${g.icon}</div>
                <div class="name">${g.name}</div>
                <div class="sub">${g.sub}</div>
                <span class="play-btn">▶ Play</span>
            </a>
        `).join('');
    </script>
</body>
</html>
