<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>JHONNYWIN – Play & Win</title>
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        body { background:#0a0e17; color:#f1f1f1; font-family:'Segoe UI',Arial,sans-serif; }
        header { background:linear-gradient(90deg,#0f1a2b,#1a2a3f); padding:15px 30px; display:flex; align-items:center; justify-content:space-between; border-bottom:2px solid #ffd700; flex-wrap:wrap; gap:10px; }
        header .logo { font-size:1.8rem; font-weight:900; background:linear-gradient(135deg,#ffd700,#f5a623); -webkit-background-clip:text; -webkit-text-fill-color:transparent; }
        nav { display:flex; align-items:center; gap:12px; flex-wrap:wrap; }
        nav a { color:#ddd; text-decoration:none; font-weight:500; transition:color 0.2s; padding:6px 10px; border-radius:6px; }
        nav a:hover, nav a.active { color:#ffd700; background:#1e2f42; }
        .btn { background:#ffd700; color:#0a0e17; padding:6px 14px; border-radius:6px; font-weight:bold; text-decoration:none; transition:0.2s; }
        .btn:hover { background:#f5a623; }
        .user-greeting { color:#ffd700; font-weight:500; }
        .banner { background:linear-gradient(135deg,#0f1a2b,#1a2a3f); padding:60px 20px; text-align:center; border-bottom:1px solid #ffd70033; }
        .banner h1 { font-size:2.8rem; background:linear-gradient(135deg,#ffd700,#ff6b00); -webkit-background-clip:text; -webkit-text-fill-color:transparent; margin-bottom:10px; }
        .banner p { color:#8899bb; font-size:1.2rem; margin-bottom:20px; }
        .banner .btn { padding:12px 30px; font-size:1.1rem; border-radius:30px; }
        .section { padding:40px 20px; max-width:1200px; margin:auto; }
        .section h2 { text-align:center; color:#ffd700; margin-bottom:30px; font-size:2rem; }
        .game-grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(180px,1fr)); gap:1.5rem; }
        .game-card { background:#141f2f; border-radius:16px; padding:1.5rem 1rem; text-align:center; border:1px solid #1e2f42; box-shadow:0 4px 15px rgba(0,0,0,0.4); transition:0.3s; cursor:pointer; }
        .game-card:hover { transform:translateY(-6px); border-color:#ffd700; box-shadow:0 8px 30px rgba(255,215,0,0.15); }
        .game-card .icon { font-size:3rem; margin-bottom:0.5rem; }
        .game-card .name { font-size:1.1rem; font-weight:700; color:#e8edf5; }
        .game-card .sub { font-size:0.75rem; color:#5a7a9a; margin-top:4px; }
        .play-btn { display:inline-block; margin-top:0.8rem; padding:0.4rem 1.2rem; border:none; border-radius:20px; background:#ffd700; color:#0a0e17; font-weight:700; cursor:pointer; transition:0.2s; }
        .play-btn:hover { transform:scale(1.05); }
        footer { background:#0f1a2b; color:#8899bb; text-align:center; padding:20px; margin-top:40px; border-top:1px solid #1e2f42; }
        footer a { color:#ffd700; text-decoration:none; margin:0 8px; }
        footer a:hover { text-decoration:underline; }
        @media (max-width:600px) { header { flex-direction:column; align-items:stretch; } nav { justify-content:center; } .banner h1 { font-size:2rem; } }
        /* Modal styles */
        .modal-overlay {
            display: none;
            position: fixed;
            top:0; left:0; right:0; bottom:0;
            background: rgba(0,0,0,0.85);
            z-index: 999;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .modal-overlay.open { display: flex; }
        .modal-box {
            background: #141f2f;
            border-radius: 16px;
            max-width: 700px;
            width: 100%;
            max-height: 90vh;
            overflow-y: auto;
            padding: 30px;
            border: 1px solid #ffd70044;
            position: relative;
        }
        .modal-close {
            position: absolute;
            top: 12px;
            right: 18px;
            font-size: 2rem;
            color: #8899bb;
            background: none;
            border: none;
            cursor: pointer;
        }
        .modal-close:hover { color: #fff; }
        .modal-box h2 { color: #ffd700; margin-bottom: 15px; text-align:center; }
        .modal-balance { color: #ffd700; font-size:1.2rem; text-align:center; margin-bottom:15px; }
        .bet-controls { margin:15px 0; display:flex; gap:10px; align-items:center; flex-wrap:wrap; justify-content:center; }
        .bet-controls input { padding:8px 12px; border-radius:8px; border:none; background:#1e2f42; color:#fff; width:120px; font-size:1rem; }
        .bet-controls button { padding:8px 20px; border:none; border-radius:8px; background:#ffd700; color:#0a0e17; font-weight:bold; cursor:pointer; transition:0.2s; }
        .bet-controls button:hover { background:#f5a623; }
        .game-area { min-height:150px; padding:15px 0; }
        .result { margin-top:10px; text-align:center; font-size:1.2rem; color:#ffd700; }
    </style>
</head>
<body>
    <header>
        <div class="logo">🎰 JHONNYWIN</div>
        <nav id="navLinks">
            <a href="#" class="active">Home</a>
            <a href="#games">Games</a>
            <a href="#promo">Promotions</a>
            <a href="#support">Support</a>
        </nav>
    </header>

    <section class="banner">
        <h1>WELCOME BONUS</h1>
        <p>PLAY · WIN · HAVE FUN<br />Arcade games with virtual points.</p>
        <a href="#games" class="btn">PLAY NOW</a>
    </section>

    <section id="games" class="section">
        <h2>🎮 Games</h2>
        <div class="game-grid" id="gameGrid"></div>
    </section>

    <footer>
        <p>© 2025 JHONNY Arcade · Educational Demo · Virtual points only</p>
    </footer>
    <!-- Modal -->
    <div class="modal-overlay" id="gameModal">
        <div class="modal-box">
            <button class="modal-close" id="closeModal">&times;</button>
            <h2 id="modalTitle">🎮 Game</h2>
            <div class="modal-balance">💰 Balance: <span id="modalBalance">100</span> coins</div>
            <div class="bet-controls">
                <label>Bet:</label>
                <input type="number" id="betAmount" value="10" min="1" step="1" />
                <button id="modalPlayBtn">Place Bet & Play</button>
            </div>
            <div id="modalGameArea" class="game-area"></div>
            <div id="modalResult" class="result">Ready to play!</div>
        </div>
    </div>

    <script>
        // ---------- AUTH (optional) ----------
        const currentUser = JSON.parse(localStorage.getItem('currentUser')) || null;
        const nav = document.getElementById('navLinks');
        if (currentUser) {
            nav.innerHTML = `
                <a href="#" class="active">Home</a>
                <a href="#games">Games</a>
                <a href="#promo">Promotions</a>
                <a href="#support">Support</a>
                <span class="user-greeting">Hi, ${currentUser.username}</span>
                <a href="#" onclick="logout(); return false;" class="btn" style="background:#ff4444;color:#fff;">Logout</a>
            `;
        } else {
            nav.innerHTML += `
                <a href="login.html" class="btn">Login</a>
                <a href="register.html" class="btn">Register</a>
            `;
        }
        window.logout = function() { localStorage.removeItem('currentUser'); location.reload(); };

        // ---------- BALANCE ----------
        let balance = parseInt(localStorage.getItem('slotBalance')) || 100;
        function updateModalBalance() {
            document.getElementById('modalBalance').textContent = balance;
            localStorage.setItem('slotBalance', balance);
        }
        updateModalBalance();

        // ---------- GAME DATA ----------
        const GAMES = [
            { id: '777', name: '777', sub: 'Lucky Slots', icon: '🎰', type: 'slot' },
            { id: 'number-guess', name: 'Number Guess', sub: 'Guess the number', icon: '🔢', type: 'guess' },
            { id: 'reaction-test', name: 'Reaction Test', sub: 'Test your speed', icon: '⚡', type: 'reaction' },
            { id: 'memory-match', name: 'Memory Match', sub: 'Match the pairs', icon: '🧠', type: 'memory' }
        ];

        const grid = document.getElementById('gameGrid');
        grid.innerHTML = GAMES.map(g => `
            <div class="game-card" data-game="${g.id}" data-type="${g.type}">
                <div class="icon">${g.icon}</div>
                <div class="name">${g.name}</div>
                <div class="sub">${g.sub}</div>
                <span class="play-btn">▶ Play</span>
            </div>
        `).join('');

        // ---------- MODAL CONTROLS ----------
        const modal = document.getElementById('gameModal');
        const closeModalBtn = document.getElementById('closeModal');
        const modalTitle = document.getElementById('modalTitle');
        const modalGameArea = document.getElementById('modalGameArea');
        const modalResult = document.getElementById('modalResult');
        const modalPlayBtn = document.getElementById('modalPlayBtn');
        const betInput = document.getElementById('betAmount');

        let currentGameType = 'slot';
        let currentGameId = '';

        function openModal(gameType, gameName) {
            modalTitle.textContent = `🎮 ${gameName}`;
            currentGameType = gameType;
            modalGameArea.innerHTML = renderGame(gameType);
            modalResult.textContent = 'Place your bet and hit Play!';
            updateModalBalance();
            modal.classList.add('open');
        }

        function closeModal() {
            modal.classList.remove('open');
            if (window.reactionTimeout) clearTimeout(window.reactionTimeout);
            if (window.slotInterval) clearInterval(window.slotInterval);
        }
        closeModalBtn.addEventListener('click', closeModal);
        modal.addEventListener('click', (e) => { if (e.target === modal) closeModal(); });

        // ---------- GAME RENDERERS ----------
        function renderGame(type) {
            switch(type) {
                case 'slot': return renderSlot();
                case 'guess': return renderGuess();
                case 'reaction': return renderReaction();
                case 'memory': return renderMemory();
                default: return '<p>Unknown game.</p>';
            }
        }

        // ----- SLOT -----
        const SLOT_SYMBOLS = ['🍒','🍋','🍉','⭐','💎','7️⃣'];
        function renderSlot() {
            return `
                <div style="display:flex;justify-content:center;gap:0.8rem;font-size:3.5rem;background:#0a0e17;padding:1.2rem;border-radius:16px;border:2px solid #ffd70044;">
                    <span id="reel1">🍒</span><span id="reel2">🍋</span><span id="reel3">🍉</span>
                </div>
            `;
        }
        function playSlot(bet) {
            const r1 = document.getElementById('reel1');
            const r2 = document.getElementById('reel2');
            const r3 = document.getElementById('reel3');
            let count = 0;
            const interval = setInterval(() => {
                r1.textContent = SLOT_SYMBOLS[Math.floor(Math.random()*SLOT_SYMBOLS.length)];
                r2.textContent = SLOT_SYMBOLS[Math.floor(Math.random()*SLOT_SYMBOLS.length)];
                r3.textContent = SLOT_SYMBOLS[Math.floor(Math.random()*SLOT_SYMBOLS.length)];
                count++;
                if (count > 10) {
                    clearInterval(interval);
                    const f1 = SLOT_SYMBOLS[Math.floor(Math.random()*SLOT_SYMBOLS.length)];
                    const f2 = SLOT_SYMBOLS[Math.floor(Math.random()*SLOT_SYMBOLS.length)];
                    const f3 = SLOT_SYMBOLS[Math.floor(Math.random()*SLOT_SYMBOLS.length)];
                    r1.textContent = f1; r2.textContent = f2; r3.textContent = f3;
                    let win = 0;
                    if (f1===f2 && f2===f3) win = bet * 10;
                    else if (f1===f2 || f2===f3 || f1===f3) win = bet * 2;
                    else win = 0;
                    balance += win;
                    updateModalBalance();
                    modalResult.textContent = win > 0 ? `🎉 You won ${win} coins!` : `😞 You lost ${bet} coins.`;
                }
            }, 80);
            window.slotInterval = interval;
        }

        // ----- GUESS -----
        let targetNumber = Math.floor(Math.random() * 10) + 1;
        let attempts = 0;
        function renderGuess() {
            return `
                <div style="text-align:center;">
                    <p style="color:#88bbdd;">Guess a number 1-10</p>
                    <input type="number" id="guessInput" min="1" max="10" style="padding:8px;border-radius:8px;border:none;background:#1e2f42;color:#fff;width:80px;text-align:center;" />
                    <button onclick="makeGuess()" style="padding:8px 20px;border:none;border-radius:8px;background:#ffd700;color:#0a0e17;font-weight:bold;cursor:pointer;margin-left:10px;">Guess</button>
                    <div id="guessResult" style="margin-top:10px;color:#ffd700;"></div>
                </div>
            `;
        }
        window.makeGuess = function() {
            const guess = parseInt(document.getElementById('guessInput').value);
            if (isNaN(guess) || guess < 1 || guess > 10) {
                modalResult.textContent = '⚠️ Enter 1-10.';
                return;
            }
            if (balance < 1) { modalResult.textContent = '❌ No coins!'; return; }
            balance -= 1;
            updateModalBalance();
            attempts++;
            const result = document.getElementById('guessResult');
            if (guess === targetNumber) {
                const win = 5 + (10 - attempts) * 2;
                balance += win;
                updateModalBalance();
                result.textContent = `🎉 Correct! +${win} coins (${attempts} attempts)`;
                targetNumber = Math.floor(Math.random() * 10) + 1;
                attempts = 0;
                modalResult.textContent = '';
            } else {
                const hint = guess < targetNumber ? '⬆️ Higher' : '⬇️ Lower';
                result.textContent = `❌ ${hint}`;
                modalResult.textContent = `Lost 1 coin. Try again.`;
            }
        };

        // ----- REACTION -----
        let reactionTimeout = null;
        let reactionStart = 0;
        function renderReaction() {
            return `
                <div style="text-align:center;">
                    <p style="color:#88bbdd;">Click when it turns green.</p>
                    <div id="reactionBox" style="width:150px;height:150px;margin:20px auto;background:#ff4444;border-radius:16px;display:flex;align-items:center;justify-content:center;font-size:1.2rem;color:#fff;cursor:pointer;transition:0.2s;">Wait...</div>
                    <button onclick="startReaction()" style="padding:8px 20px;border:none;border-radius:8px;background:#ffd700;color:#0a0e17;font-weight:bold;cursor:pointer;">Start</button>
                </div>
            `;
        }
        window.startReaction = function() {
            const box = document.getElementById('reactionBox');
            if (reactionTimeout) clearTimeout(reactionTimeout);
            box.style.background = '#ff4444';
            box.textContent = 'Wait...';
            const delay = 1000 + Math.random() * 3000;
            reactionTimeout = setTimeout(() => {
                box.style.background = '#44ff44';
                box.textContent = 'CLICK!';
                reactionStart = Date.now();
                box.onclick = function() {
                    const reactionTime = Date.now() - reactionStart;
                    const win = Math.max(0, 10 - Math.floor(reactionTime / 100));
                    if (balance < 1) { modalResult.textContent = '❌ No coins!'; return; }
                    balance -= 1;
                    balance += win;
                    updateModalBalance();
                    modalResult.textContent = `⏱️ ${reactionTime}ms - +${win} coins!`;
                    box.style.background = '#ff4444';
                    box.textContent = 'Done';
                    box.onclick = null;
                    reactionTimeout = null;
                };
            }, delay);
            window.reactionTimeout = reactionTimeout;
        };

        // ----- MEMORY -----
        const emojis = ['🍎','🍌','🍇','🍉','🍓','🍒','🍑','🍍'];
        let cards = [], flipped = [], matched = 0, canFlip = true;
        function renderMemory() {
            let deck = [...emojis, ...emojis];
            for (let i = deck.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [deck[i], deck[j]] = [deck[j], deck[i]];
            }
            cards = deck;
            flipped = [];
            matched = 0;
            canFlip = true;
            return `
                <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:10px;max-width:300px;margin:0 auto;">
                    ${deck.map((emoji, idx) => `
                        <div id="mcard-${idx}" data-index="${idx}" onclick="flipCard(${idx})" style="background:#1e2f42;border-radius:10px;aspect-ratio:1;display:flex;align-items:center;justify-content:center;font-size:2.5rem;cursor:pointer;border:2px solid #ffd70033;">❓</div>
                    `).join('')}
                </div>
            `;
        }
        window.flipCard = function(idx) {
            if (!canFlip) return;
            const el = document.getElementById(`mcard-${idx}`);
            if (el.textContent !== '❓') return;
            if (flipped.length >= 2) return;
            el.textContent = cards[idx];
            el.style.background = '#2a3a5a';
            flipped.push(idx);
            if (flipped.length === 2) {
                canFlip = false;
                const [i1, i2] = flipped;
                if (cards[i1] === cards[i2]) {
                    matched += 2;
                    document.getElementById(`mcard-${i1}`).style.border = '2px solid #44ff44';
                    document.getElementById(`mcard-${i2}`).style.border = '2px solid #44ff44';
                    flipped = [];
                    canFlip = true;
                    if (matched === cards.length) {
                        const win = 20;
                        balance += win;
                        updateModalBalance();
                        modalResult.textContent = `🎉 Memory complete! +${win} coins!`;
                    }
                } else {
                    setTimeout(() => {
                        document.getElementById(`mcard-${i1}`).textContent = '❓';
                        document.getElementById(`mcard-${i1}`).style.background = '#1e2f42';
                        document.getElementById(`mcard-${i2}`).textContent = '❓';
                        document.getElementById(`mcard-${i2}`).style.background = '#1e2f42';
                        flipped = [];
                        canFlip = true;
                    }, 800);
                }
                if (balance >= 1) {
                    balance -= 1;
                    updateModalBalance();
                    modalResult.textContent = '🧠 Lost 1 coin. Keep going!';
                } else {
                    modalResult.textContent = '❌ No coins!';
                }
            }
        };

        // ---------- MODAL PLAY BUTTON ----------
        modalPlayBtn.addEventListener('click', function() {
            const bet = parseInt(betInput.value);
            if (isNaN(bet) || bet < 1) {
                modalResult.textContent = '⚠️ Enter a valid bet.';
                return;
            }
            if (bet > balance) {
                modalResult.textContent = '❌ Insufficient balance!';
                return;
            }
            // Deduct bet (game will add winnings)
            balance -= bet;
            updateModalBalance();
            // Trigger game
            switch(currentGameType) {
                case 'slot': playSlot(bet); break;
                case 'guess': // guess handles its own deduction
                    balance += bet; // re-add because guess uses 1 coin per guess
                    updateModalBalance();
                    modalResult.textContent = 'Guess game uses 1 coin per guess. Bet ignored.';
                    break;
                case 'reaction':
                    balance += bet;
                    updateModalBalance();
                    modalResult.textContent = 'Reaction uses 1 coin per try. Bet ignored.';
                    break;
                case 'memory':
                    balance += bet;
                    updateModalBalance();
                    modalResult.textContent = 'Memory uses 1 coin per pair. Bet ignored.';
                    break;
                default: modalResult.textContent = 'Unknown game.';
            }
        });

        // ---------- CARD CLICK ----------
        document.querySelectorAll('.game-card').forEach(card => {
            card.addEventListener('click', function() {
                const gameId = this.dataset.game;
                const gameType = this.dataset.type;
                const gameName = this.querySelector('.name').textContent;
                openModal(gameType, gameName);
                currentGameId = gameId;
            });
        });

        // ---------- ENTER KEY ----------
        betInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') modalPlayBtn.click();
        });

        // ---------- INIT ----------
        updateModalBalance();
    </script>
</body>
</html>
