<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login – Luckline</title>
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        body { background:#0b0b0f; color:#f1f1f1; font-family:'Segoe UI',Arial,sans-serif; display:flex; justify-content:center; align-items:center; min-height:100vh; }
        .login-box { background:#16161d; padding:40px; border-radius:16px; max-width:400px; width:100%; box-shadow:0 8px 30px rgba(0,0,0,0.5); }
        .login-box h2 { color:#00e676; margin-bottom:20px; text-align:center; }
        .login-box input { width:100%; padding:12px; margin:10px 0; border:none; border-radius:8px; background:#2a2a3a; color:#fff; font-size:1rem; }
        .login-box button { width:100%; padding:12px; border:none; border-radius:8px; background:#00e676; color:#000; font-weight:bold; font-size:1.1rem; cursor:pointer; transition:0.2s; }
        .login-box button:hover { background:#1de9b6; }
        .login-box .error { color:#ff6b6b; margin-top:10px; text-align:center; }
        .login-box .info { color:#8899bb; margin-top:15px; text-align:center; }
        .login-box .info a { color:#00e676; text-decoration:none; }
        .login-box .info a:hover { text-decoration:underline; }
    </style>
</head>
<body>
    <div class="login-box">
        <h2>🔐 Login</h2>
        <form id="loginForm">
            <input type="text" id="username" placeholder="Username" required />
            <input type="password" id="password" placeholder="Password" required />
            <button type="submit">Login</button>
            <div id="errorMsg" class="error"></div>
            <div class="info">Don't have an account? <a href="register.html">Register</a></div>
        </form>
    </div>
    <script>
        document.getElementById('loginForm').addEventListener('submit', (e) => {
            e.preventDefault();
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value.trim();
            const users = JSON.parse(localStorage.getItem('users')) || {};
            if (users[username] && users[username] === password) {
                localStorage.setItem('currentUser', JSON.stringify({ username }));
                window.location.href = 'index.html';
            } else {
                document.getElementById('errorMsg').textContent = '❌ Invalid username or password.';
            }
        });
    </script>
</body>
</html>
